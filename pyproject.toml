[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notelab"
version = "0.1.0"
description = "A self-improving research MCP server on top of Google NotebookLM — scores source data quality and A/B-tests deep-research prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "werister" }]
keywords = ["mcp", "notebooklm", "research", "agents", "nlm", "deep-research", "ab-testing"]
# Engine core is stdlib-only on purpose: it installs and its tests run with zero deps.
dependencies = []

[project.optional-dependencies]
# Optional accelerator: the official MCP SDK. Unpinned: server.py binds all tools
# on both v1 (FastMCP) and v2 (MCPServer) — verified live against both real
# packages. NOT required — the repo ships its own stdlib-only stdio MCP server
# (see notelab.mcp_stdio), so `pip install .` runs with no third-party deps at all.
mcp = ["mcp"]
dev = ["pytest>=7.0"]
# Optional: the Laya ablation tie-breaker (research/laya_judge.py, FIELD-NOTES.md
# gap #8). NOT required — use_laya defaults to False, the stdlib-only default path
# is completely unaffected by this extra existing.
laya = ["laya-mlx; python_version >= '3.11'"]

[project.scripts]
nlm-research-mcp = "notelab.server:main"

[project.urls]
Homepage = "https://github.com/werister/notelab"
Design = "https://github.com/werister/notelab/blob/main/docs/DESIGN.md"

[tool.hatch.build.targets.wheel]
packages = ["src/notelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
